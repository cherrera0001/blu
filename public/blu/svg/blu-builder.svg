<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="Blu constructor">
  <!-- Blu character system — geometría vectorial editable. Paleta de originales holablu. -->
  
  <defs>
    <radialGradient id="bodyGrad" cx="36%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#A8D8F8"/>
      <stop offset="42%" stop-color="#60B8F8"/>
      <stop offset="100%" stop-color="#1878F8"/>
    </radialGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60B8F8"/>
      <stop offset="100%" stop-color="#1070F8"/>
    </linearGradient>
    <radialGradient id="cheekSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE97A"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A06A3F"/>
      <stop offset="100%" stop-color="#7A4E2E"/>
    </linearGradient>
  </defs>

  
  <g id="body">
    <path id="torso" fill="url(#bodyGrad)" d="M100 22
      C128 22 152 46 160 84
      C168 126 162 160 142 182
      C128 194 114 200 100 200
      C86 200 72 194 58 182
      C38 160 32 126 40 84
      C48 46 72 22 100 22Z"/>
    <ellipse cx="70" cy="90" rx="16" ry="12" fill="url(#cheekSoft)"/>
    <ellipse cx="130" cy="90" rx="16" ry="12" fill="url(#cheekSoft)"/>
  </g>

  <g id="legs">
    <ellipse cx="76" cy="208" rx="24" ry="13" fill="url(#legGrad)"/>
    <ellipse cx="124" cy="208" rx="24" ry="13" fill="url(#legGrad)"/>
  </g>

  <g id="arms">
    <path fill="url(#bodyGrad)" d="M48 112 C28 98 22 70 38 56 C50 46 68 54 70 70 C72 86 64 102 54 112 Z"/>
    <g id="hand-wave" transform="translate(30 46) rotate(-16)">
      <ellipse cx="10" cy="12" rx="12" ry="10" fill="#60B8F8"/>
      <ellipse cx="1" cy="2" rx="3.4" ry="5" fill="#A8D8F8"/>
      <ellipse cx="9" cy="-1" rx="3.4" ry="5.2" fill="#A8D8F8"/>
      <ellipse cx="17" cy="2" rx="3.2" ry="4.6" fill="#A8D8F8"/>
    </g>
    <path fill="url(#bodyGrad)" d="M154 118 C172 130 176 154 164 168 C152 180 134 172 130 158 C126 146 134 128 146 120 Z"/>
  </g>
  <g id="face">
    <ellipse id="eye-l" cx="80" cy="94" rx="9.5" ry="11.5" fill="#1A1A1B"/>
    <ellipse id="eye-r" cx="120" cy="94" rx="9.5" ry="11.5" fill="#1A1A1B"/>
    <path id="mouth" fill="#0E5AD0" d="M86 118 C92 136 108 136 114 118 C106 128 94 128 86 118Z"/>
  </g>
  <g id="prop-helmet">
    <path fill="url(#helmetGrad)" d="M60 38 C66 18 134 18 140 38 L142 54 L58 54 Z"/>
    <path fill="#FFD54A" d="M52 52 L148 52 L150 64 L50 64 Z"/>
    <path fill="#E6B800" d="M96 22 L104 22 L106 52 L94 52 Z" opacity="0.35"/>
  </g>
  <g id="prop-belt">
    <rect x="56" y="158" width="88" height="18" rx="4" fill="url(#beltGrad)"/>
    <rect x="90" y="162" width="20" height="10" rx="2" fill="#B8B8C0"/>
    <rect x="60" y="160" width="18" height="14" rx="2" fill="#7A4E2E"/>
    <rect x="122" y="160" width="18" height="14" rx="2" fill="#7A4E2E"/>
    <rect x="64" y="154" width="4" height="10" rx="1" fill="#B8B8C0"/>
    <rect x="70" y="152" width="3" height="12" rx="1" fill="#FFD54A"/>
  </g>
  <g id="prop-blueprint" transform="translate(156 156) rotate(14)">
    <rect x="-6" y="-28" width="18" height="56" rx="4" fill="#F5F8FC"/>
    <path stroke="#7EB8E8" stroke-width="1.2" fill="none" d="M-2 -20 H8 M-2 -12 H8 M-2 -4 H6 M0 4 H8"/>
  </g>

</svg>

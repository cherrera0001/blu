<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="Blu leyendo">
  <!-- Blu character system — geometría vectorial editable. Paleta de originales holablu. -->
  
  <defs>
    <radialGradient id="bodyGrad" cx="36%" cy="26%" r="74%">
      <stop offset="0%" stop-color="#A8D8F8"/>
      <stop offset="42%" stop-color="#60B8F8"/>
      <stop offset="100%" stop-color="#1878F8"/>
    </radialGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60B8F8"/>
      <stop offset="100%" stop-color="#1070F8"/>
    </linearGradient>
    <radialGradient id="cheekSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE97A"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <linearGradient id="beltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A06A3F"/>
      <stop offset="100%" stop-color="#7A4E2E"/>
    </linearGradient>
  </defs>

  
  <g id="body">

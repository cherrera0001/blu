name: Mobile APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nombre del release (ej. v0.3.0)"
        required: true
        default: "v0.4.3"

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS: undici 8 (vía jsdom) exige >=22.19 (zlib zstd) y RN 0.81/Expo 54
          # lo soportan. Con Node 20 el gate MASTG de v0.4.3 no pudo arrancar los tests.
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Expo 54 / RN 0.81 usa compileSdk 36; el paquete legacy `tools` ya no existe.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: TDD seguridad móvil (MASTG contratos)
        run: npm run test:mobile:security

      - name: Semgrep móvil (MASTG-TOOL-0110)
        run: |
          python3 -m pip install --user semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep --config security/semgrep-mobile.yml --error apps/mobile packages/blu-core

      - name: Prebuild nativo Android (Expo)
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
          NODE_ENV: development
        run: npx expo prebuild --platform android --clean --no-install

      # assembleRelease embebe el JS (export:embed). assembleDebug omite el bundle y
      # exige Metro → RedBox "loadJSBundleFromAssets" al sideloadear sin PC.
      - name: Compilar APK (release firmado con keystore debug, instalable)
        working-directory: apps/mobile/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Nombrar artefacto
        id: apk
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SRC="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          DEST="blu-android-${VERSION}.apk"
          test -f "$SRC"
          cp "$SRC" "$DEST"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu-android-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: MASTG asserts APK (aapt2 + apksigner)
        run: node scripts/mastg-apk-assert.mjs "${{ steps.apk.outputs.file }}"

      - name: Resolver tag del release
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Blu Android ${{ steps.apk.outputs.version }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ## Blu Android ${{ steps.apk.outputs.version }}

            APK de **vista previa** para instalación directa (sin Play Store).
            Gate MASTG automático: contratos Vitest + semgrep + aapt2/apksigner.

            ### Instalar en Android
            1. Descarga `blu-android-${{ steps.apk.outputs.version }}.apk` desde Assets.
            2. En el teléfono, permite instalar apps de orígenes desconocidos para el navegador/gestor de archivos.
            3. Abre el APK e instala.

            ### Qué incluye
            - Onboarding: 7 temas, máximo 4
            - Check-in diario y resumen de 7 días
            - Borrado local de datos
            - `allowBackup=false`, sin cleartext
            - Sin cuentas ni chat/voz (aún)

            ### Probar
            ```bash
            adb install -r blu-android-${{ steps.apk.outputs.version }}.apk
            maestro test apps/mobile/maestro/smoke-onboarding.yaml
            ```

            > APK **release** firmado con keystore de preview (debug). Embebe el JS; instalable sin Metro. No es la firma de producción de Play Store.

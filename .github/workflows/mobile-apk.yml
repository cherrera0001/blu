name: Mobile APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nombre del release (ej. v0.3.0)"
        required: true
        default: "v0.3.0"

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Prebuild nativo Android (Expo)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK (debug firmado, instalable)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nombrar artefacto
        id: apk
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SRC="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="blu-android-${VERSION}.apk"
          test -f "$SRC"
          cp "$SRC" "$DEST"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu-android-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Resolver tag del release
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Blu Android ${{ steps.apk.outputs.version }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ## Blu Android ${{ steps.apk.outputs.version }}

            APK de **vista previa** para instalación directa (sin Play Store).

            ### Instalar en Android
            1. Descarga `blu-android-${{ steps.apk.outputs.version }}.apk` desde Assets.
            2. En el teléfono, permite instalar apps de orígenes desconocidos para el navegador/gestor de archivos.
            3. Abre el APK e instala.

            ### Qué incluye
            - Onboarding: 7 temas, máximo 4
            - Check-in diario y resumen de 7 días
            - Borrado local de datos
            - Sin cuentas ni chat/voz (aún)

            > Firmado en modo **debug** (preview). Sirve para probar; no es la firma de producción de Play Store.

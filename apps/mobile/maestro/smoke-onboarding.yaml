# Maestro (MASTG-TOOL-0154) — humo del flujo principal.
# Requiere dispositivo/emulador con el APK instalado:
#   adb install -r blu-android-X.Y.Z.apk
#   maestro test apps/mobile/maestro/smoke-onboarding.yaml
appId: cl.blu.app
---
- launchApp
- assertVisible: "Blu"
- assertVisible:
    id: "blu-companion"
- assertVisible: "Hay 7 temas"
- tapOn:
    id: "habit-movement"
- tapOn:
    id: "consent-operativo"
- tapOn:
    id: "continue-button"
- assertVisible: "Hoy"
- assertVisible:
    id: "blu-companion"
- tapOn:
    id: "checkin-movement-simplify"
- tapOn:
    id: "checkin-movement-barrier-energy"
- tapOn:
    id: "checkin-movement-option-0"
- assertVisible: "Hacer una pausa de dos minutos para cambiar de postura."
- assertVisible:
    id: "checkin-movement-undo"
- tapOn:
    id: "checkin-movement-undo"
- assertVisible: "Elegir una pausa breve para moverte."
- tapOn:
    id: "checkin-movement-why"
- assertVisible: ".*sin evidencia verificada.*"
- scrollUntilVisible:
    element:
      id: "speak-today"
- scrollUntilVisible:
    element:
      id: "open-chat"
- scrollUntilVisible:
    element:
      id: "weekly-summary"
- scrollUntilVisible:
    element:
      id: "week-bars"
- scrollUntilVisible:
    element:
      id: "options-toggle"
- tapOn:
    id: "options-toggle"
- scrollUntilVisible:
    element:
      id: "my-data"
- assertVisible: ".*Las conversaciones con Blu no se guardan.*"
- assertVisible:
    id: "export-data"
- scrollUntilVisible:
    element:
      id: "edit-selection"
